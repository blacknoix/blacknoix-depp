# ClusterIP only — no LoadBalancer, no Ingress, no ALB annotations in this slice.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: depp
    depp.blacknoix.io/environment: staging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
