# INTENTIONALLY NON-DEPLOYABLE until image placeholder is replaced with an
# immutable ECR digest (@sha256:...). Never deploy a mutable tag-only reference.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: depp
    app.kubernetes.io/component: api
    depp.blacknoix.io/environment: staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Pilot defaults — not measured production capacity.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: depp
        app.kubernetes.io/component: api
        depp.blacknoix.io/environment: staging
        depp.blacknoix.io/data-classification: synthetic-only
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: false
      securityContext:
        # Official node image runs as USER node (non-root). Numeric UID is not
        # pinned in the Dockerfile; runAsNonRoot rejects root without inventing UID.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          # REPLACE before any apply. Form after promotion:
          #   <ecr-registry>/depp-api-gateway@sha256:<digest>
          image: REPLACE_WITH_ECR_IMAGE_AT_DIGEST
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: APP_NAME
              value: depp-api-gateway
            # Sensitive / issuer configuration: values must come from an injected
            # Secret (see templates/api-gateway-external-secret.yaml.template).
            # No defaults for credentials or issuer settings.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-gateway-runtime
                  key: DATABASE_URL
            - name: AUTH_MODE
              valueFrom:
                secretKeyRef:
                  name: api-gateway-runtime
                  key: AUTH_MODE
            - name: AUTH_EXPLICIT_ROLES_MODE
              valueFrom:
                secretKeyRef:
                  name: api-gateway-runtime
                  key: AUTH_EXPLICIT_ROLES_MODE
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-runtime
                  key: JWT_ACCESS_SECRET
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: api-gateway-runtime
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: api-gateway-runtime
                  key: JWT_AUDIENCE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Discovered routes: GET /health (liveness), GET /ready (readiness).
          # Port 3000 from Dockerfile EXPOSE and env PORT default.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Pilot defaults — not measured production sizing.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
